# .github/workflows/test.yml
name: Python Tests

on:
  push:
    branches: [main]
    paths: ['lib/**', 'scripts/**', 'tests/**', 'templates/**', 'configs/generated/**', 'asterisk/**', 'schema/**', 'config/**', 'requirements.txt', 'requirements-dev.txt']
  pull_request:
    paths: ['lib/**', 'scripts/**', 'tests/**', 'templates/**', 'configs/generated/**', 'asterisk/**', 'schema/**', 'config/**', 'requirements.txt', 'requirements-dev.txt']

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  # Telegram ping to the owner when an unattended run fails. Requires repo
  # secret TELEGRAM_BOT_TOKEN + variable TELEGRAM_CHAT_ID; skips with a warning when unset.
  notify-failure:
    needs: [pytest]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/telegram-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
