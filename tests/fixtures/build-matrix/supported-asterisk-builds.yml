# Frozen build matrix for tests/test_build_matrix_alpine_tags.py.
#
# The live asterisk/supported-asterisk-builds.yml changes on every release PR:
# apply-tag-lifecycle.py moves additional_tags to the newest version of each
# line and finalize-deprecations.yml stamps deprecated_at on the old one. Tests
# that assert tag-emission logic must not follow that churn, so they run
# against this snapshot (entries copied verbatim from main @ 7a21042):
#   - 22.10.1     active, owns latest/stable; Debian trixie + Alpine 3.24 & edge
#   - 22.8-cert3  deprecated; Debian trixie + Alpine 3.24 (deprecation-survival)
#   - 23.4.1      active; Debian trixie + forky (member 'experimental') + Alpine

latest_builds:
  - version: "22.10.1"
    os_matrix:
      - os: "debian"
        distribution: "trixie"
        architectures:
          - "amd64"
          - "arm64"

      - os: "alpine"
        distribution: "3.24"
        alpine_tree: "v3.24"
        alpine_role: "stable"
        apk_version: "22.10.1-r1"
        apk_packages: ["opus", "srtp", "curl", "speex", "fax", "odbc", "ldap", "pgsql", "prometheus", "mobile"]
        architectures:
          - "amd64"
          - "arm64"
          - "armv7"
          - "armhf"
      - os: "alpine"
